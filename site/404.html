<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>Página não encontrada — JuntaVale</title>
<meta name="description" content="Esse link não existe ou mudou de lugar.">
<style>
  :root{
    --amber:#FBBF24;
    --amber-deep:#B45309;
    --blue:#245AD6;
    --blue-deep:#1E42B0;
    --ink:#1C1917;
    --ink-soft:#57534E;
    --line:#E7E2DA;
    --paper:#FBFAF7;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65;
    font-size:17px;
    display:flex;flex-direction:column;
  }
  .wrap{width:100%;max-width:680px;margin:0 auto;padding:0 22px;flex:1;
    display:flex;flex-direction:column;}

  header{padding:44px 0 26px;}
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    font-weight:800;font-size:20px;letter-spacing:.3px;
    text-decoration:none;color:var(--ink);
  }
  .brand .mark{width:28px;height:28px;border-radius:8px;display:block;}

  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px 0 60px;
  }
  .mark-big{width:88px;height:88px;border-radius:24px;display:block;margin-bottom:26px;}
  h1{font-size:28px;line-height:1.25;margin:0 0 10px;letter-spacing:-.4px;font-weight:800;}
  p{margin:0 0 28px;color:var(--ink-soft);font-size:16.5px;max-width:420px;}

  .btn{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--ink);color:#fff;
    padding:14px 24px;border-radius:999px;
    font-size:15px;font-weight:700;letter-spacing:.2px;
    text-decoration:none;
  }

  footer{
    padding:26px 0 40px;border-top:1px solid var(--line);
    font-size:13.5px;color:var(--ink-soft);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  footer a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="brand" href="/">
      <img src="logo.png" class="mark" alt="JuntaVale">
      JuntaVale
    </a>
  </header>

  <main>
    <img src="logo.png" class="mark-big" alt="JuntaVale">
    <h1>Página não encontrada</h1>
    <p>Esse link não existe ou mudou de lugar.</p>
    <a class="btn" href="/">Voltar ao início</a>
  </main>

  <footer>
    <span>© JuntaVale</span>
    <a href="/privacidade">Privacidade</a>
    <a href="/excluir-conta">Excluir conta</a>
    <a href="/termos">Termos</a>
    <a href="/contato">Contato</a>
    <a href="/sobre">Sobre</a>
  </footer>

</div>
</body>
</html>
