<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index,follow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>Fale com a gente — JuntaVale</title>
<meta name="description" content="Como entrar em contato com a equipe do JuntaVale por e-mail ou WhatsApp.">
<style>
  :root{
    --amber:#FBBF24;
    --amber-deep:#B45309;
    --blue:#245AD6;
    --blue-deep:#1E42B0;
    --ink:#1C1917;
    --ink-soft:#57534E;
    --line:#E7E2DA;
    --paper:#FBFAF7;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65;
    font-size:17px;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 22px;}

  header{padding:44px 0 26px;border-bottom:1px solid var(--line);}
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    font-weight:800;font-size:20px;letter-spacing:.3px;
    text-decoration:none;color:var(--ink);
  }
  .brand .mark{width:28px;height:28px;border-radius:8px;display:block;}
  h1{font-size:31px;line-height:1.2;margin:26px 0 8px;letter-spacing:-.4px;font-weight:800;}
  .sub{color:var(--ink-soft);font-size:16px;margin:0;}

  main{padding:34px 0 10px;}
  a{color:var(--amber-deep);}

  .panel{
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:20px 22px;margin:0 0 14px;
    display:flex;align-items:center;gap:14px;
  }
  .panel-solo{justify-content:center;}
  .panel .ic{
    width:40px;height:40px;border-radius:11px;flex-shrink:0;
    background:#FFF3D6;color:var(--amber-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
  }
  .panel h2{margin:0 0 3px;font-size:15.5px;font-weight:700;}
  .panel p{margin:0;font-size:15px;}

  .btn-wa{
    display:inline-flex;align-items:center;gap:9px;
    background:#25D366;color:#fff;
    padding:14px 22px;border-radius:999px;
    font-size:15px;font-weight:700;letter-spacing:.2px;
    text-decoration:none;
  }
  .btn-wa svg{width:19px;height:19px;flex-shrink:0;}

  .note{color:var(--ink-soft);font-size:15px;margin:20px 0 0;}

  footer{
    margin-top:48px;padding:26px 0 40px;border-top:1px solid var(--line);
    font-size:13.5px;color:var(--ink-soft);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  footer a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line);}
  footer nav{display:flex;gap:16px;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="brand" href="/">
      <img src="logo.png" class="mark" alt="JuntaVale">
      JuntaVale
    </a>
    <h1>Fale com a gente</h1>
    <p class="sub">Dúvida, problema ou sugestão? Escolha o canal que preferir.</p>
  </header>

  <main>

    <div class="panel">
      <div class="ic">✉️</div>
      <div>
        <h2>E-mail</h2>
        <p><a href="mailto:contato.juntavale@gmail.com">contato.juntavale@gmail.com</a></p>
      </div>
    </div>

    <div class="panel panel-solo">
      <p><a class="btn-wa" href="https://wa.me/380965261393?text=Oi!%20Preciso%20de%20ajuda%20com%20o%20JuntaVale" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2C6.48 2 2 6.34 2 11.7c0 1.97.63 3.8 1.72 5.33L2.5 21.5l4.66-1.2c1.47.85 3.17 1.3 4.84 1.3 5.52 0 10-4.34 10-9.7C22 6.34 17.52 2 12 2Zm0 17.6c-1.5 0-2.97-.4-4.24-1.16l-.3-.18-2.77.71.72-2.66-.2-.3A7.98 7.98 0 0 1 4 11.7C4 7.45 7.58 4 12 4s8 3.45 8 7.7-3.58 7.9-8 7.9Zm4.4-5.9c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1-.37-1.9-1.17-.7-.62-1.18-1.39-1.31-1.63-.14-.24-.01-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.4-.54-.41h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.12 3.64.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28Z"/></svg>Chamar no WhatsApp</a></p>
    </div>

    <p class="note">Respondemos em até 2 dias úteis.</p>

  </main>

  <footer>
    <span>© JuntaVale</span>
    <nav>
      <a href="/privacidade">Privacidade</a>
      <a href="/excluir-conta">Excluir conta</a>
      <a href="/termos">Termos</a>
      <a href="/sobre">Sobre</a>
    </nav>
  </footer>

</div>
</body>
</html>
