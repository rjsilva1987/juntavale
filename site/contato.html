<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index,follow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>Fale com a gente — JuntaVale</title>
<meta name="description" content="Como entrar em contato com a equipe do JuntaVale por e-mail ou WhatsApp.">
<style>
  :root{
    --amber:#FBBF24;
    --amber-deep:#B45309;
    --blue:#245AD6;
    --blue-deep:#1E42B0;
    --ink:#1C1917;
    --ink-soft:#57534E;
    --line:#E7E2DA;
    --paper:#FBFAF7;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65;
    font-size:17px;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 22px;}

  header{padding:44px 0 26px;border-bottom:1px solid var(--line);}
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    font-weight:800;font-size:20px;letter-spacing:.3px;
    text-decoration:none;color:var(--ink);
  }
  .brand .mark{width:28px;height:28px;border-radius:8px;display:block;}
  h1{font-size:31px;line-height:1.2;margin:26px 0 8px;letter-spacing:-.4px;font-weight:800;}
  .sub{color:var(--ink-soft);font-size:16px;margin:0;}

  main{padding:34px 0 10px;}
  a{color:var(--amber-deep);}

  .panel{
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:20px 22px;margin:0 0 14px;
    display:flex;align-items:center;gap:14px;
  }
  .panel .ic{
    width:40px;height:40px;border-radius:11px;flex-shrink:0;
    background:#FFF3D6;color:var(--amber-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
  }
  .panel h2{margin:0 0 3px;font-size:15.5px;font-weight:700;}
  .panel p{margin:0;font-size:15px;}

  .btn-wa{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--ink);color:#fff;
    padding:14px 22px;border-radius:999px;
    font-size:15px;font-weight:700;letter-spacing:.2px;
    text-decoration:none;
  }
  .panel p.wa-number{margin:8px 0 0;font-size:13px;color:var(--ink-soft);}

  .note{color:var(--ink-soft);font-size:15px;margin:20px 0 0;}

  footer{
    margin-top:48px;padding:26px 0 40px;border-top:1px solid var(--line);
    font-size:13.5px;color:var(--ink-soft);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  footer a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line);}
  footer nav{display:flex;gap:16px;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="JuntaVale">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2A63E0"/>
            <stop offset="1" stop-color="#1E42B0"/>
          </linearGradient>
        </defs>
        <rect width="100" height="100" rx="24" fill="url(#bg)"/>
        <path d="M50 78C50 78 22 61 22 41.5C22 30.7 30.3 23 39.4 23C44.6 23 49 25.6 50 30C51 25.6 55.4 23 60.6 23C69.7 23 78 30.7 78 41.5C78 61 50 78 50 78Z" fill="#FBBF24"/>
        <path d="M50 34C48 40 45 44 45 50C45 54.4 47.2 57.5 50 60C52.8 57.5 55 54.4 55 50C55 44 52 40 50 34Z" fill="#1E42B0"/>
      </svg>
      JuntaVale
    </a>
    <h1>Fale com a gente</h1>
    <p class="sub">Dúvida, problema ou sugestão? Escolha o canal que preferir.</p>
  </header>

  <main>

    <div class="panel">
      <div class="ic">✉️</div>
      <div>
        <h2>E-mail</h2>
        <p><a href="mailto:contato.juntavale@gmail.com">contato.juntavale@gmail.com</a></p>
      </div>
    </div>

    <div class="panel">
      <div class="ic">💬</div>
      <div>
        <h2>WhatsApp</h2>
        <p><a class="btn-wa" href="https://wa.me/380965261393?text=Oi!%20Preciso%20de%20ajuda%20com%20o%20JuntaVale" target="_blank" rel="noopener noreferrer">Chamar no WhatsApp</a></p>
        <p class="wa-number">+380 96 526 1393</p>
      </div>
    </div>

    <p class="note">Respondemos em até 2 dias úteis.</p>

  </main>

  <footer>
    <span>© JuntaVale</span>
    <nav>
      <a href="/privacidade">Privacidade</a>
      <a href="/excluir-conta">Excluir conta</a>
    </nav>
  </footer>

</div>
</body>
</html>
